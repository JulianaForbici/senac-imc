<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de IMC</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50c9ce);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            text-align: left;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #4a90e2;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357ABD;
        }

        .message {
            margin-top: 20px;
            background-color: #f0f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4a90e2;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de IMC</h1>

    <form action="calculoimc.php" method="POST" onsubmit="return validarFormulario()">
        <label for="peso">Peso (kg):</label>
        <input type="text" name="n1" id="peso" placeholder="Ex: 70,5" required>

        <label for="altura">Altura (m):</label>
        <input type="text" name="n2" id="altura" placeholder="Ex: 1,75" required>

        <button type="submit">Calcular IMC</button>
    </form>

    <div class="message" id="mensagem"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const message = params.get('message');
    if (message) {
        document.getElementById('mensagem').textContent = decodeURIComponent(message);
    }
    function validarFormulario() {
        const peso = document.getElementById('peso').value.replace(',', '.');
        const altura = document.getElementById('altura').value.replace(',', '.');

        if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
            alert('Por favor, insira valores numéricos válidos maiores que zero.');
            return false;
        }
        return true;
    }
</script>

</body>
</html>
